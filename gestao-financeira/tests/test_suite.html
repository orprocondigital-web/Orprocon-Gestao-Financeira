<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Suite</title>
  <script src="../js/storage.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/integracao.js"></script>
</head>
<body>
  <div id="results">Running tests...</div>
  <script>
    const results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || "Assertion failed");
    }
    assert.equal = function(a, b, msg) {
      if (a !== b) throw new Error((msg ? msg + ": " : "") + JSON.stringify(a) + " !== " + JSON.stringify(b));
    };
    assert.deepEqual = function(a, b, msg) {
      if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg ? msg + ": " : "") + JSON.stringify(a) + " !== " + JSON.stringify(b));
    };
    assert.ok = function(val, msg) {
      if (!val) throw new Error(msg || "Expected truthy value");
    };

    function test(name, fn) {
      try {
        fn();
        results.push({ name: name, passed: true });
      } catch (err) {
        results.push({ name: name, passed: false, error: err.message, stack: err.stack });
      }
    }

    const I = Integracao;

    // Helper functions for mock data
    function L(dados) {
      return Object.assign({
        data: "2026-09-01", desc: "TESTE", doc: "", modelo: "",
        valorNum: 100, sign: "C", bloqueado: false, valorInvalido: false, valorOriginal: "",
        categoria: "Recebimento", unidade: "Matriz", natureza: "", conta: "", nome: "", cpf: ""
      }, dados);
    }
    function fonte(lancamentos, nome, conta) {
      return { nome: nome || "Sicoob Conta 643", contaBanco: conta !== undefined ? conta : "643", lancamentos: lancamentos };
    }

    // 1. Core tests
    test("Core parseValor", function() {
      assert.equal(Core.parseValor("1.234,56"), 1234.56);
      assert.equal(Core.parseValor("1234,56"), 1234.56);
      assert.equal(Core.parseValor("1234.56"), 1234.56);
      assert.equal(Core.parseValor("R$ 86.461,48"), 86461.48);
      assert.equal(Core.parseValor("-1,20"), -1.2);
    });

    test("Core parseValorCell", function() {
      assert.deepEqual(Core.parseValorCell("5.514,70C"), { valorNum: 5514.7, sign: "C" });
      assert.deepEqual(Core.parseValorCell("-1,20D"), { valorNum: 1.2, sign: "D" });
    });

    // 2. Integracao tests
    test("valor e doc no formato do TXT", function() {
      assert.equal(I.valorTxt(1610.49), "1610,49");
      assert.equal(I.valorTxt(-86461.48), "86461,48");
      assert.equal(I.docTxt("13693803"), "13693803");
      assert.equal(I.docTxt("137103.0"), "137103");
      assert.equal(I.docTxt("NF 25,112"), "NF 25112");
    });

    test("normaliza unidade", function() {
      assert.equal(I.normalizaUnidade("Ciciuma"), "Criciúma");
      assert.equal(I.normalizaUnidade("Matriz "), "Matriz");
    });

    test("conta do nome", function() {
      assert.equal(I.contaDoNome("Sicoob 24402-3 Conta 643"), "643");
      assert.equal(I.contaDoNome("Banco do Brasil"), "");
    });

    test("formato atual: gera TXTs com tabelaUnidades fornecida", function() {
      const unidades = [
        { linha: ["Matriz", "00.589.066/0001-69", 158] },
        { linha: ["Passo Fundo", "00.589.066/0008-35", 160] }
      ];
      const tx = I.coletarTransacoes([fonte([
        L({ data: "2026-09-01", categoria: "Recebimento", unidade: "Passo Fundo", doc: "13693803", nome: "ELETRO VOLTS, LTDA", cpf: "14580324000150", valorNum: 972.92 }),
        L({ data: "2026-09-02", categoria: "Despesa", unidade: "Passo Fundo", doc: "", nome: "POSTO X", conta: "499", natureza: "Viagens e Estadas", valorNum: 9.8, sign: "D" }),
        L({ data: "2026-09-02", categoria: "Pagamento", unidade: "Tubarão", valorNum: 1 }) // Tubarão fora da tabela
      ])]);
      const dist = I.distribuirPorUnidade(tx);

      // Com tabelaUnidades e sem incluirTodas: só unidades da tabela
      const arqs = I.gerarTxts(dist, unidades);
      assert.deepEqual(arqs.map(function(a){ return a.nome; }), ["DESPESA_Passo_Fundo.txt", "RECEBIMENTO_Passo_Fundo.txt"]);
    });

    test("formato atual: gera TXTs para todas as unidades quando incluirTodas: true", function() {
      const unidades = [
        { linha: ["Passo Fundo", "00.589.066/0008-35", 160] }
      ];
      const tx = I.coletarTransacoes([fonte([
        L({ data: "2026-09-01", categoria: "Recebimento", unidade: "Passo Fundo", doc: "13693803", valorNum: 100 }),
        L({ data: "2026-09-02", categoria: "Pagamento", unidade: "Nova Filial", valorNum: 50 })
      ])]);
      const dist = I.distribuirPorUnidade(tx);

      const arqs = I.gerarTxts(dist, unidades, { incluirTodas: true });
      assert.ok(arqs.some(function(a){ return a.nome === "RECEBIMENTO_Passo_Fundo.txt"; }));
      assert.ok(arqs.some(function(a){ return a.nome === "PAGAMENTO_Nova_Filial.txt"; }));
    });

    test("SCI Único: gera arquivo mesmo se tabelaUnidades for vazia quando incluirTodas: true", function() {
      const tx = I.coletarTransacoes([fonte([
        L({ data: "2026-09-01", categoria: "Recebimento", unidade: "Filial Manual", doc: "100", valorNum: 250 })
      ])]);
      const dist = I.distribuirPorUnidade(tx);
      const arqs = I.gerarTxtsUnico(dist, [], [], { incluirTodas: true });
      assert.equal(arqs.length, 1);
      assert.equal(arqs[0].nome, "UNICO_Filial_Manual.txt");
      assert.ok(arqs[0].conteudo.includes("Filial_Manual"));
    });

    // Test ZIP implementation
    test("Gerador ZIP Store em JavaScript", function() {
      // Cria zip com 2 arquivos de teste
      function makeCrcTable() {
        var c, table = [];
        for (var n = 0; n < 256; n++) {
          c = n;
          for (var k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
          table[n] = c >>> 0;
        }
        return table;
      }
      var crcTable = makeCrcTable();
      function crc32(bytes) {
        var crc = 0 ^ (-1);
        for (var i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
        return (crc ^ (-1)) >>> 0;
      }
      var encoder = new TextEncoder();
      var localParts = [], centralParts = [], offset = 0;
      var agora = new Date();
      var dosTime = (agora.getHours() << 11) | (agora.getMinutes() << 5) | (agora.getSeconds() >> 1);
      var dosDate = ((agora.getFullYear() - 1980) << 9) | ((agora.getMonth() + 1) << 5) | agora.getDate();

      var arqs = [
        { nome: "UNICO_Matriz.txt", conteudo: "000001,20260901,100,200\r\n" },
        { nome: "PENDENCIAS.csv", conteudo: "Unidade;Banco;Motivo\r\n" }
      ];

      arqs.forEach(function (arq) {
        var nomeBytes = encoder.encode(arq.nome);
        var dadosBytes = encoder.encode(arq.conteudo);
        var crc = crc32(dadosBytes);
        var tamanho = dadosBytes.length;

        var localHeader = new Uint8Array(30 + nomeBytes.length);
        var dv = new DataView(localHeader.buffer);
        dv.setUint32(0, 0x04034b50, true);
        dv.setUint16(4, 20, true);
        dv.setUint16(6, 0x0800, true);
        dv.setUint16(8, 0, true);
        dv.setUint16(10, dosTime, true);
        dv.setUint12 = dv.setUint16(12, dosDate, true);
        dv.setUint32(14, crc, true);
        dv.setUint32(18, tamanho, true);
        dv.setUint32(22, tamanho, true);
        dv.setUint16(26, nomeBytes.length, true);
        dv.setUint16(28, 0, true);
        localHeader.set(nomeBytes, 30);
        localParts.push(localHeader);
        localParts.push(dadosBytes);

        var centralHeader = new Uint8Array(46 + nomeBytes.length);
        var cdv = new DataView(centralHeader.buffer);
        cdv.setUint32(0, 0x02014b50, true);
        cdv.setUint16(4, 20, true);
        cdv.setUint16(6, 20, true);
        cdv.setUint16(8, 0x0800, true);
        cdv.setUint16(10, 0, true);
        cdv.setUint16(12, dosTime, true);
        cdv.setUint16(14, dosDate, true);
        cdv.setUint32(16, crc, true);
        cdv.setUint32(20, tamanho, true);
        cdv.setUint32(24, tamanho, true);
        cdv.setUint16(28, nomeBytes.length, true);
        cdv.setUint16(30, 0, true);
        cdv.setUint16(32, 0, true);
        cdv.setUint16(34, 0, true);
        cdv.setUint16(36, 0, true);
        cdv.setUint32(38, 0, true);
        cdv.setUint32(42, offset, true);
        centralHeader.set(nomeBytes, 46);
        centralParts.push(centralHeader);
        offset += localHeader.length + dadosBytes.length;
      });

      var centralSize = centralParts.reduce(function (acc, p) { return acc + p.length; }, 0);
      var eocd = new Uint8Array(22);
      var edv = new DataView(eocd.buffer);
      edv.setUint32(0, 0x06054b50, true);
      edv.setUint16(4, 0, true);
      edv.setUint16(6, 0, true);
      edv.setUint16(8, arqs.length, true);
      edv.setUint16(10, arqs.length, true);
      edv.setUint32(12, centralSize, true);
      edv.setUint32(16, offset, true);
      edv.setUint16(20, 0, true);

      var zipBlob = new Blob(localParts.concat(centralParts).concat([eocd]), { type: "application/zip" });
      assert.ok(zipBlob.size > 100, "Zip size should be > 100 bytes");
    });

    // Testes de UI e Remoção de Unidades
    test("UI: Renderização da barra lateral com botão de menos (-) nas Unidades", function() {
      var item = { id: "unid-teste-1", label: "Filial Curitiba", section: "Unidades" };
      var row = document.createElement("div");
      row.className = "nav-item-row";
      var btn = document.createElement("button");
      btn.className = "acct-btn";
      btn.textContent = item.label;
      row.appendChild(btn);

      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "nav-item-del";
      delBtn.title = "Remover unidade \"" + item.label + "\"";
      delBtn.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>';
      row.appendChild(delBtn);

      assert.equal(row.children.length, 2, "Linha deve conter botão da unidade e botão de menos");
      assert.equal(delBtn.title, 'Remover unidade "Filial Curitiba"');
      assert.ok(delBtn.innerHTML.includes("M5 12h14"), "Ícone deve conter traço de menos");
    });

    test("UI: Lógica de exclusão de unidade (removerUnidade)", function() {
      var unidadesMock = [
        { id: "u-1", label: "Matriz" },
        { id: "u-2", label: "Filial Errada" }
      ];
      // Simula exclusão
      var idParaRemover = "u-2";
      var alvo = unidadesMock.filter(function(u){ return u.id === idParaRemover; })[0];
      assert.ok(alvo, "Unidade a remover existe");
      unidadesMock = unidadesMock.filter(function(u){ return u.id !== idParaRemover; });
      assert.equal(unidadesMock.length, 1);
      assert.equal(unidadesMock[0].label, "Matriz");
    });

    test("UI: Painel de Downloads no Master", function() {
      var box = document.createElement("div");
      box.id = "master-downloads";
      var arquivos = [
        { nome: "UNICO_Matriz.txt", conteudo: "linha1\r\n" },
        { nome: "PENDENCIAS_UNICO.csv", conteudo: "col1;col2\r\n" }
      ];

      var html = '<div class="downloads-box-head"><h3>Arquivos gerados (' + arquivos.length + ')</h3></div>' +
        '<div class="downloads-list">';
      arquivos.forEach(function(a){
        html += '<div class="download-item"><span class="filename">' + a.nome + '</span></div>';
      });
      html += '</div>';
      box.innerHTML = html;

      assert.ok(box.textContent.includes("UNICO_Matriz.txt"));
      assert.ok(box.textContent.includes("PENDENCIAS_UNICO.csv"));
      assert.equal(box.querySelectorAll(".download-item").length, 2);
    });

    // Write results to DOM
    var allPassed = results.every(function(r){ return r.passed; });
    var html = "<h1>Tests " + (allPassed ? "PASSED" : "FAILED") + "</h1><ul>";
    results.forEach(function(r){
      html += "<li style='color:" + (r.passed ? "green" : "red") + "'>" +
        (r.passed ? "PASS" : "FAIL") + ": " + r.name +
        (r.error ? " (" + r.error + ")" : "") + "</li>";
    });
    html += "</ul>";
    document.getElementById("results").innerHTML = html;
    window.__TEST_RESULTS__ = { allPassed: allPassed, results: results };
  </script>
</body>
</html>
